baseURL = "https://arlindohall.com/"
title = "Miller Hall"

# No empty taxonomy pages in the output
disableKinds = ["taxonomy", "term"]

# site/ is committed and deployed directly by .github/workflows/deploy.yml;
# hugo runs locally only (`hugo` or `hugo server`).
publishDir = "site"

[markup.highlight]
style = "catppuccin-latte"
# emit .chroma classes; colors come from static/css/chroma.css (latte + dark mocha)
noClasses = false
